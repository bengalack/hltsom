<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Explicit white, never currentColor: this file is loaded through an <img>,
       which cannot inherit color from the page. currentColor would resolve to
       black and then vanish under the nav's mix-blend-mode: difference.
       The nav's blend mode inverts this to dark over the white blocks. -->
  <rect x="1" y="1" width="98" height="98" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="50" y="56" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="30" fill="#ffffff">HLT</text>
</svg>
